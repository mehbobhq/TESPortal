name: Supabase Development Database

# Manual only. Targets the Supabase DEVELOPMENT project (tes-portal-dev) and nothing else: the job runs in the
# `supabase-dev` GitHub environment, whose secrets are the only credentials it can read, and the scripts refuse any
# host that is not *.supabase.com / *.supabase.co. It has no Google credentials (no id-token permission), so it cannot
# reach Cloud SQL. Production uses the separate production-* workflows.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment (the only accepted value is supabase-dev)"
        type: choice
        required: true
        options:
          - supabase-dev
      action:
        description: "migrate = apply pending migrations; verify = read-only verification; diagnose-auth = read-only backend authentication diagnostic; data-check = read-only row counts (no migration)"
        type: choice
        required: true
        options:
          - verify
          - migrate
          - diagnose-auth
          - data-check
      backend_port:
        description: "verify only: runtime endpoint for the backend role (5432 = session pooler, 6543 = transaction pooler)"
        type: choice
        required: false
        default: "5432"
        options:
          - "5432"
          - "6543"
      confirm:
        description: "Type: supabase-dev"
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: supabase-dev-database
  cancel-in-progress: false

jobs:
  supabase-dev:
    if: github.ref == 'refs/heads/main' && inputs.environment == 'supabase-dev' && inputs.confirm == 'supabase-dev'
    runs-on: ubuntu-24.04
    environment: supabase-dev
    timeout-minutes: 30
    env:
      TES_DATABASE_TARGET: supabase-dev
      # Supavisor SESSION mode (port 5432): migrations hold a session advisory lock and need one stable connection.
      # Host and database name are secrets, so they are set only on the steps that connect (not for the apt step).
      PGPORT: "5432"
      PGSSLMODE: verify-full
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install a PostgreSQL 17 client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y >/dev/null
          sudo apt-get install -y -qq postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"
      - name: Write the CA certificate
        env:
          CA_PEM: ${{ secrets.SUPABASE_DEV_CA_PEM }}
        run: |
          umask 077
          printf '%s\n' "$CA_PEM" > "$RUNNER_TEMP/supabase-ca.pem"
          grep -q 'BEGIN CERTIFICATE' "$RUNNER_TEMP/supabase-ca.pem"
          echo "PGSSLROOTCERT=$RUNNER_TEMP/supabase-ca.pem" >> "$GITHUB_ENV"
      - name: Apply migrations (migrator, session mode)
        if: inputs.action == 'migrate'
        env:
          PGHOST: ${{ secrets.SUPABASE_DEV_POOLER_HOST }}
          PGDATABASE: ${{ secrets.SUPABASE_DEV_DATABASE }}
          PGUSER: ${{ secrets.SUPABASE_DEV_MIGRATOR_USER }}
          PGPASSWORD: ${{ secrets.SUPABASE_DEV_MIGRATOR_PASSWORD }}
        run: bash scripts/database/supabase-dev/migrate-dev.sh
      - name: Read-only verification
        if: inputs.action == 'verify'
        env:
          PGHOST: ${{ secrets.SUPABASE_DEV_POOLER_HOST }}
          PGDATABASE: ${{ secrets.SUPABASE_DEV_DATABASE }}
          TES_MIGRATOR_USER: ${{ secrets.SUPABASE_DEV_MIGRATOR_USER }}
          TES_MIGRATOR_PASSWORD: ${{ secrets.SUPABASE_DEV_MIGRATOR_PASSWORD }}
          TES_BACKEND_USER: ${{ secrets.SUPABASE_DEV_BACKEND_USER }}
          TES_BACKEND_PASSWORD: ${{ secrets.SUPABASE_DEV_BACKEND_PASSWORD }}
          # 6543 proves the transaction pooler the application will use
          TES_BACKEND_PORT: ${{ inputs.backend_port || '5432' }}
        run: bash scripts/database/supabase-dev/verify-readonly.sh
      - name: Backend authentication diagnostic (read-only; yes/no properties and redacted messages only)
        if: inputs.action == 'diagnose-auth'
        env:
          PGHOST: ${{ secrets.SUPABASE_DEV_POOLER_HOST }}
          PGDATABASE: ${{ secrets.SUPABASE_DEV_DATABASE }}
          TES_MIGRATOR_USER: ${{ secrets.SUPABASE_DEV_MIGRATOR_USER }}
          TES_MIGRATOR_PASSWORD: ${{ secrets.SUPABASE_DEV_MIGRATOR_PASSWORD }}
          TES_BACKEND_USER: ${{ secrets.SUPABASE_DEV_BACKEND_USER }}
          TES_BACKEND_PASSWORD: ${{ secrets.SUPABASE_DEV_BACKEND_PASSWORD }}
        run: bash scripts/database/supabase-dev/diagnose-backend-auth.sh
      - name: Row counts for authorisation (read-only; counts only)
        if: inputs.action == 'data-check'
        env:
          PGHOST: ${{ secrets.SUPABASE_DEV_POOLER_HOST }}
          PGDATABASE: ${{ secrets.SUPABASE_DEV_DATABASE }}
          TES_MIGRATOR_USER: ${{ secrets.SUPABASE_DEV_MIGRATOR_USER }}
          TES_MIGRATOR_PASSWORD: ${{ secrets.SUPABASE_DEV_MIGRATOR_PASSWORD }}
        run: bash scripts/database/supabase-dev/data-check.sh
