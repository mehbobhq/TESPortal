name: Production Database Migration

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: production-database-migration
  cancel-in-progress: false

jobs:
  migrate:
    name: Run production database migrations
    runs-on: ubuntu-24.04
    environment: production-database

    if: github.ref == 'refs/heads/main'

    env:
      TES_CLOUD_SQL_INSTANCE: ${{ vars.TES_CLOUD_SQL_INSTANCE }}
      TES_POSTGRES_DATABASE: ${{ vars.TES_POSTGRES_DATABASE }}
      TES_POSTGRES_IAM_USER: ${{ vars.TES_POSTGRES_IAM_USER }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          create_credentials_file: true

      - name: Download and verify Cloud SQL Auth Proxy
        env:
          CLOUD_SQL_PROXY_VERSION: "2.24.1"
          CLOUD_SQL_PROXY_SHA256: "fae2766aac9d614a2bdef2f2a7778f3d054f3acd5ff07a81a9e300bd471512eb"
        run: |
          curl --fail --silent --show-error --location \
            --output cloud-sql-proxy \
            "https://storage.googleapis.com/cloud-sql-connectors/cloud-sql-proxy/v${CLOUD_SQL_PROXY_VERSION}/cloud-sql-proxy.linux.amd64"

          echo "${CLOUD_SQL_PROXY_SHA256} *cloud-sql-proxy" | sha256sum --check --strict

          chmod +x cloud-sql-proxy
          ./cloud-sql-proxy --version

      - name: Start Cloud SQL Auth Proxy
        run: |
          ./cloud-sql-proxy \
            --auto-iam-authn \
            --address 127.0.0.1 \
            --port 5432 \
            "${TES_CLOUD_SQL_INSTANCE}" \
            > cloud-sql-proxy.log 2>&1 &

          echo $! > cloud-sql-proxy.pid

      - name: Wait for proxy
        run: |
          for attempt in {1..30}; do
            if (echo > /dev/tcp/127.0.0.1/5432) >/dev/null 2>&1; then
              echo "Cloud SQL Auth Proxy is accepting connections."
              exit 0
            fi
            sleep 1
          done

          echo "Cloud SQL Auth Proxy did not become ready."
          cat cloud-sql-proxy.log
          exit 1

      - name: Run migration control system
        env:
          PGHOST: 127.0.0.1
          PGPORT: "5432"
          PGDATABASE: ${{ env.TES_POSTGRES_DATABASE }}
          PGUSER: ${{ env.TES_POSTGRES_IAM_USER }}
        run: bash scripts/database/migrate.sh

      - name: Verify migration control system
        env:
          PGHOST: 127.0.0.1
          PGPORT: "5432"
          PGDATABASE: ${{ env.TES_POSTGRES_DATABASE }}
          PGUSER: ${{ env.TES_POSTGRES_IAM_USER }}
        run: |
          psql \
            --no-password \
            --set=ON_ERROR_STOP=1 \
            --command="
              SELECT
                current_database() AS database,
                current_user AS database_user,
                to_regnamespace('tes_system') IS NOT NULL AS tes_system_exists,
                to_regclass('tes_system.schema_migrations') IS NOT NULL AS migration_ledger_exists,
                (SELECT count(*) FROM tes_system.schema_migrations) AS applied_migrations;
            "
+      - name: Verify 0004 tenant isolation foundation
        env:
          PGHOST: 127.0.0.1
          PGPORT: "5432"
          PGDATABASE: ${{ env.TES_POSTGRES_DATABASE }}
          PGUSER: ${{ env.TES_POSTGRES_IAM_USER }}
        run: |
          psql \
            --no-password \
            --set=ON_ERROR_STOP=1 <<'SQL'
          SELECT
            tes_security.current_customer_id() IS NULL
              AS missing_context_returns_null
          \gset

          \if :missing_context_returns_null
          \else
            \echo 'ERROR: missing tenant context did not resolve to NULL.'
            \quit 4
          \endif

          BEGIN;

          SELECT set_config('tes.customer_id', '', true);

          SELECT
            tes_security.current_customer_id() IS NULL
              AS blank_context_returns_null
          \gset

          \if :blank_context_returns_null
          \else
            \echo 'ERROR: blank tenant context did not resolve to NULL.'
            \quit 4
          \endif

          SELECT set_config(
            'tes.customer_id',
            'not-a-valid-customer-uuid',
            true
          );

          SELECT
            tes_security.current_customer_id() IS NULL
              AS malformed_context_returns_null
          \gset

          \if :malformed_context_returns_null
          \else
            \echo 'ERROR: malformed tenant context did not resolve to NULL.'
            \quit 4
          \endif

          SELECT set_config(
            'tes.customer_id',
            '123e4567-e89b-42d3-a456-426614174000',
            true
          );

          SELECT
            tes_security.current_customer_id()
              = '123e4567-e89b-42d3-a456-426614174000'::uuid
              AS valid_context_round_trips
          \gset

          \if :valid_context_round_trips
          \else
            \echo 'ERROR: valid tenant context did not round-trip.'
            \quit 4
          \endif

          COMMIT;

          SELECT
            tes_security.current_customer_id() IS NULL
              AS context_cleared_after_transaction
          \gset

          \if :context_cleared_after_transaction
          \else
            \echo 'ERROR: tenant context survived the transaction boundary.'
            \quit 4
          \endif

          \echo '0004 tenant isolation behavioral verification passed.'
          SQL

      - name: Stop Cloud SQL Auth Proxy
        if: always()
        run: |
          if [ -f cloud-sql-proxy.pid ]; then
            kill "$(cat cloud-sql-proxy.pid)" 2>/dev/null || true
          fi