name: Supabase Dev Credential Equivalence

# TEMPORARY one-time diagnostic. Delete this file after use. Answers one question, in one word (MATCH / MISMATCH /
# INCONCLUSIVE): does the SUPABASE_DEV_BACKEND_PASSWORD secret equal the password that works locally? It reads the
# backend password secret and two one-time comparison secrets (a fresh random key and an HMAC-SHA-256 under that key,
# created locally by scripts/database/supabase-dev/diagnostics/credential_equivalence.py). It does not connect to
# Supabase, prints no secret-derived value, and publishes no output or artifact.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type: credential-equivalence"
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: supabase-dev-database
  cancel-in-progress: false

jobs:
  compare:
    if: github.ref == 'refs/heads/main' && inputs.confirm == 'credential-equivalence'
    runs-on: ubuntu-24.04
    environment: supabase-dev
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Compare (prints MATCH, MISMATCH or INCONCLUSIVE only)
        env:
          SUPABASE_DEV_BACKEND_PASSWORD: ${{ secrets.SUPABASE_DEV_BACKEND_PASSWORD }}
          SUPABASE_DEV_CMP_KEY: ${{ secrets.SUPABASE_DEV_CMP_KEY }}
          SUPABASE_DEV_CMP_EXPECTED: ${{ secrets.SUPABASE_DEV_CMP_EXPECTED }}
        run: python3 -I scripts/database/supabase-dev/diagnostics/credential_equivalence.py compare
