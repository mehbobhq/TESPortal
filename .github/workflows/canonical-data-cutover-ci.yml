name: Canonical Data Cutover CI

on:
  pull_request:
    paths:
      - "database/migrations/0029_canonical_data_cutover_import_infrastructure.sql"
      - "lib/legacy-import/**"
      - "lib/auth/tes-capabilities.ts"
      - "test/lib/legacy-import/**"
      - "scripts/database/verify-production-legacy-import-infrastructure.sh"
      - "scripts/test/run-auth-tests.sh"
      - "docs/canonical-data-cutover-browser-authority-retirement.md"
      - ".github/workflows/canonical-data-cutover-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      CI_DATABASE: tes_ci_legacy_import
      CI_MIGRATOR: "tes-database-migrator@tes-production-510007.iam"
      CI_MIGRATOR_PASSWORD: ci-migrator
      CI_RUNTIME: "tes-backend@tes-production-510007.iam"
      CI_RUNTIME_PASSWORD: ci-runtime
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Create production-shaped roles and database
        run: |
          psql -v ON_ERROR_STOP=1 -d postgres -c "CREATE ROLE \"$CI_MIGRATOR\" LOGIN PASSWORD '$CI_MIGRATOR_PASSWORD'"
          psql -v ON_ERROR_STOP=1 -d postgres -c "CREATE ROLE \"$CI_RUNTIME\" LOGIN PASSWORD '$CI_RUNTIME_PASSWORD'"
          psql -v ON_ERROR_STOP=1 -d postgres -c "CREATE DATABASE $CI_DATABASE OWNER \"$CI_MIGRATOR\""
      - name: Apply complete migration history through 0029
        env:
          PGDATABASE: tes_ci_legacy_import
          PGUSER: "tes-database-migrator@tes-production-510007.iam"
          PGPASSWORD: ci-migrator
        run: |
          first29="$(mktemp -d)"
          for f in database/migrations/[0-9][0-9][0-9][0-9]_*.sql; do
            version="$(basename "$f")"; version="${version%%_*}"
            if [[ "$version" < "0030" ]]; then cp "$f" "$first29/"; fi
          done
          test "$(ls "$first29" | wc -l)" = "29"
          MIGRATIONS_DIR="$first29" bash scripts/database/migrate.sh
      - name: Verify 0029 ledger and import infrastructure
        env:
          PGDATABASE: tes_ci_legacy_import
          PGUSER: "tes-database-migrator@tes-production-510007.iam"
          PGPASSWORD: ci-migrator
        run: |
          test "$(psql -Atc 'select count(*) from tes_system.schema_migrations')" = "29"
          bash scripts/database/verify-production-legacy-import-infrastructure.sh
      - name: Run legacy import static tests
        run: |
          node --test \
            test/lib/legacy-import/legacy-import-boundaries.test.ts \
            test/lib/legacy-import/source.test.ts \
            test/lib/legacy-import/companies-domain-boundaries.test.ts \
            test/lib/legacy-import/browser-stores-domain-boundaries.test.ts \
            test/lib/legacy-import/repository-boundaries.test.ts
      - name: Run legacy import DB fixture
        env:
          TES_TEST_ADMIN_DATABASE_URL: "postgres://tes-database-migrator%40tes-production-510007.iam:ci-migrator@127.0.0.1:5432/tes_ci_legacy_import"
          TES_TEST_RUNTIME_DATABASE_URL: "postgres://tes-backend%40tes-production-510007.iam:ci-runtime@127.0.0.1:5432/tes_ci_legacy_import"
        run: node --test --test-concurrency=1 test/lib/legacy-import/legacy-import.db.test.ts
      - name: TypeScript regression gate
        shell: bash
        run: |
          set +e
          pnpm exec tsc --noEmit --pretty false > /tmp/head-tsc.txt 2>&1
          git worktree add /tmp/base "${{ github.event.pull_request.base.sha || '85914ad01b0d59f8d90d7b343b02ec8590902b0f' }}"
          cd /tmp/base
          pnpm install --frozen-lockfile >/dev/null
          pnpm exec tsc --noEmit --pretty false > /tmp/base-tsc.txt 2>&1
          cd -
          grep 'error TS' /tmp/head-tsc.txt | sed -E 's#^([^(:]+)\([^)]*\): ##' | sort > /tmp/head-normalized.txt
          grep 'error TS' /tmp/base-tsc.txt | sed -E 's#^([^(:]+)\([^)]*\): ##' | sort > /tmp/base-normalized.txt
          # Regression gate: the head may fix baseline diagnostics but must not introduce any new one.
          comm -13 /tmp/base-normalized.txt /tmp/head-normalized.txt > /tmp/new-diagnostics.txt
          if [ -s /tmp/new-diagnostics.txt ]; then
            echo "New TypeScript diagnostics introduced:"; cat /tmp/new-diagnostics.txt; exit 1
          fi
          echo "No new TypeScript diagnostics versus baseline."
