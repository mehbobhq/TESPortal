# TES Document Security Scanner - explicit freshclam configuration.
#
# This file entirely REPLACES the Debian clamav-freshclam package's own
# template (COPY'd over it in the Dockerfile). A prior version of this
# Dockerfile patched that template in place with `sed -i '/^Example/d'`;
# this file replaces that approach with a small, fully authored, reviewable
# configuration instead, so every directive here is explained rather than
# inherited silently from a distribution default.

# Where the update tool downloads new CVD/CLD files to - must match
# clamd.conf's DatabaseDirectory, and the directory the Dockerfile's
# build-time seeding step and non-root chown already target.
DatabaseDirectory /var/lib/clamav

# Standard official ClamAV signature mirror network.
DatabaseMirror database.clamav.net

# Operational log only - update attempts, versions, mirror errors. Never
# document content: freshclam never sees uploaded documents at all: it only
# ever talks to ClamAV's own signature-distribution network. Matches the
# existing chown of /var/log/clamav to the tesscan runtime user.
UpdateLogFile /var/log/clamav/freshclam.log

# The real reload path a persistent clamd requires: after a successful
# signature update, freshclam reads THIS SAME clamd.conf (to find clamd's
# configured Unix socket, see clamd.conf's LocalSocket) and sends it a
# RELOAD command so the already-running daemon picks up the new database
# without a full process restart. Before this phase, no clamd.conf existed
# for this to point at at all - which is exactly why entrypoint.sh's
# production logs previously showed "NotifyClamd: Can't find or parse
# configuration file /etc/clamav/clamd.conf". That warning is resolved by
# this line now pointing at a real, valid clamd.conf (see clamd.conf in this
# same directory) - established for the first time in this phase.
#
# NOTE (unverified in this session - no Docker/ClamAV available to test
# directly): a NotifyClamd attempt that cannot reach a running clamd (e.g.
# during the build-time freshclam invocation, before any clamd process
# exists) is expected, per ClamAV's documented behavior, to log a
# non-fatal warning without causing freshclam's own exit code to fail - this
# should be confirmed against the real Docker build, which this
# environment cannot run.
NotifyClamd /etc/clamav/clamd.conf

# This container invokes freshclam manually - once at image build time, once
# best-effort at container startup (see Dockerfile and entrypoint.sh) - it
# does not run freshclam as its own continuously-looping background updater
# process in this phase. `Checks` is freshclam's own internal
# update-frequency setting for when IT runs as a persistent daemon (via
# `freshclam -d`); since this service never invokes freshclam that way, this
# value is inert today, and is set to 0 to document that fact explicitly
# rather than leave it ambiguous.
Checks 0
