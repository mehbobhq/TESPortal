name: Production Companies Foundation Verification

on:
  workflow_dispatch:
    inputs:
      phase:
        description: "pre = before the batch is applied; post = after it is applied"
        required: true
        default: post
        type: choice
        options:
          - pre
          - post
      from_migration:
        description: "first migration of the batch under verification (0016 Tax/Registration, 0017 Insurance, 0018 Credentials, 0019 Company Operating Profile, 0025 Insurance scheduled vehicles, 0026 Vehicle merge ledger)"
        required: true
        default: "0025"
        type: choice
        options:
          - "0016"
          - "0017"
          - "0018"
          - "0019"
          - "0025"
          - "0026"
      through_migration:
        description: "last migration of the batch under verification (a run through 0025 / 0026 also verifies the full current catalogue; 0020-0024 have their own scripts)"
        required: true
        default: "0026"
        type: choice
        options:
          - "0016"
          - "0017"
          - "0018"
          - "0019"
          - "0025"
          - "0026"
      expect_empty:
        description: "post phase: require every business table of the batch to be empty (right after the migrations); choose 0 for a live system"
        required: true
        default: "1"
        type: choice
        options:
          - "1"
          - "0"
      baseline_counts:
        description: "post phase, optional: table=count pairs from the PRE run's ROWCOUNT lines (comma-separated); each listed table must still hold exactly that many rows"
        required: false
        default: ""
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: production-companies-foundation-verification
  cancel-in-progress: false

jobs:
  verify:
    name: Verify production Companies foundation and identity additions (0016-0019, 0025-0026)
    runs-on: ubuntu-24.04
    environment: production-database

    if: github.ref == 'refs/heads/main'

    env:
      TES_CLOUD_SQL_INSTANCE: ${{ vars.TES_CLOUD_SQL_INSTANCE }}
      TES_POSTGRES_DATABASE: ${{ vars.TES_POSTGRES_DATABASE }}
      TES_POSTGRES_IAM_USER: ${{ vars.TES_POSTGRES_IAM_USER }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          create_credentials_file: true

      - name: Download and verify Cloud SQL Auth Proxy
        env:
          CLOUD_SQL_PROXY_VERSION: "2.24.1"
          CLOUD_SQL_PROXY_SHA256: "fae2766aac9d614a2bdef2f2a7778f3d054f3acd5ff07a81a9e300bd471512eb"
        run: |
          curl --fail --silent --show-error --location \
            --output cloud-sql-proxy \
            "https://storage.googleapis.com/cloud-sql-connectors/cloud-sql-proxy/v${CLOUD_SQL_PROXY_VERSION}/cloud-sql-proxy.linux.amd64"
          echo "${CLOUD_SQL_PROXY_SHA256} *cloud-sql-proxy" | sha256sum --check --strict
          chmod +x cloud-sql-proxy
          ./cloud-sql-proxy --version

      - name: Start Cloud SQL Auth Proxy
        run: |
          ./cloud-sql-proxy \
            --auto-iam-authn \
            --address 127.0.0.1 \
            --port 5432 \
            "${TES_CLOUD_SQL_INSTANCE}" \
            > cloud-sql-proxy.log 2>&1 &
          echo $! > cloud-sql-proxy.pid

      - name: Wait for proxy
        run: |
          for attempt in {1..30}; do
            if (echo > /dev/tcp/127.0.0.1/5432) >/dev/null 2>&1; then
              echo "Cloud SQL Auth Proxy is accepting connections."
              exit 0
            fi
            sleep 1
          done
          echo "Cloud SQL Auth Proxy did not become ready."
          cat cloud-sql-proxy.log
          exit 1

      - name: Verify Companies foundation (read-only)
        env:
          PGHOST: 127.0.0.1
          PGPORT: "5432"
          PGDATABASE: ${{ env.TES_POSTGRES_DATABASE }}
          PGUSER: ${{ env.TES_POSTGRES_IAM_USER }}
          TES_VERIFY_PHASE: ${{ inputs.phase }}
          TES_VERIFY_FROM: ${{ inputs.from_migration }}
          TES_VERIFY_THROUGH: ${{ inputs.through_migration }}
          TES_VERIFY_EXPECT_EMPTY: ${{ inputs.expect_empty }}
          TES_VERIFY_BASELINE_COUNTS: ${{ inputs.baseline_counts }}
        run: bash scripts/database/verify-production-companies-foundation.sh

      - name: Stop Cloud SQL Auth Proxy
        if: always()
        run: |
          if [ -f cloud-sql-proxy.pid ]; then
            kill "$(cat cloud-sql-proxy.pid)" 2>/dev/null || true
          fi
