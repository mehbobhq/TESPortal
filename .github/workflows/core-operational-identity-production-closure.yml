name: Core Operational Identity Production Closure
# One-shot gated closure: PRE -> APPLY -> POST; stops on first failure.

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/core-operational-identity-production-closure.yml"

permissions:
  contents: read
  id-token: write

concurrency:
  group: production-core-operational-identity-closure
  cancel-in-progress: false

jobs:
  close:
    if: startsWith(github.event.head_commit.message, 'Run Core Operational Identity production closure')
    runs-on: ubuntu-24.04
    environment: production-database
    env:
      TES_CLOUD_SQL_INSTANCE: ${{ vars.TES_CLOUD_SQL_INSTANCE }}
      TES_POSTGRES_DATABASE: ${{ vars.TES_POSTGRES_DATABASE }}
      TES_POSTGRES_IAM_USER: ${{ vars.TES_POSTGRES_IAM_USER }}
      TES_EXPECTED_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          create_credentials_file: true
      - name: Download and verify Cloud SQL Auth Proxy
        run: |
          curl --fail --silent --show-error --location --output cloud-sql-proxy https://storage.googleapis.com/cloud-sql-connectors/cloud-sql-proxy/v2.24.1/cloud-sql-proxy.linux.amd64
          echo "fae2766aac9d614a2bdef2f2a7778f3d054f3acd5ff07a81a9e300bd471512eb *cloud-sql-proxy" | sha256sum --check --strict
          chmod +x cloud-sql-proxy
      - name: Start proxy
        run: |
          ./cloud-sql-proxy --auto-iam-authn --address 127.0.0.1 --port 5432 "${TES_CLOUD_SQL_INSTANCE}" > cloud-sql-proxy.log 2>&1 &
          echo $! > cloud-sql-proxy.pid
          for attempt in {1..30}; do (echo > /dev/tcp/127.0.0.1/5432) >/dev/null 2>&1 && exit 0; sleep 1; done
          cat cloud-sql-proxy.log; exit 1
      - name: PRE
        env:
          PGHOST: 127.0.0.1
          PGPORT: "5432"
          PGDATABASE: ${{ env.TES_POSTGRES_DATABASE }}
          PGUSER: ${{ env.TES_POSTGRES_IAM_USER }}
          TES_VERIFY_PHASE: pre
        run: bash scripts/database/verify-production-core-operational-identity.sh
      - name: APPLY
        env:
          PGHOST: 127.0.0.1
          PGPORT: "5432"
          PGDATABASE: ${{ env.TES_POSTGRES_DATABASE }}
          PGUSER: ${{ env.TES_POSTGRES_IAM_USER }}
        run: bash scripts/database/migrate.sh
      - name: POST
        env:
          PGHOST: 127.0.0.1
          PGPORT: "5432"
          PGDATABASE: ${{ env.TES_POSTGRES_DATABASE }}
          PGUSER: ${{ env.TES_POSTGRES_IAM_USER }}
          TES_VERIFY_PHASE: post
        run: bash scripts/database/verify-production-core-operational-identity.sh
      - name: Stop proxy
        if: always()
        run: '[ ! -f cloud-sql-proxy.pid ] || kill "$(cat cloud-sql-proxy.pid)" 2>/dev/null || true'
