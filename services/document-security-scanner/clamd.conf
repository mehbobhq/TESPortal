# TES Document Security Scanner - explicit clamd configuration.
#
# This file entirely REPLACES the Debian clamav-daemon package's own
# template (COPY'd over it in the Dockerfile) - it does not patch or trust
# distribution defaults. The package's template, like clamav-freshclam's,
# ships with a packager-inserted "Example" guard line that must be removed
# before the daemon will run at all; rather than patch that template again
# (as was previously done for freshclam.conf), this is a small, fully
# authored, reviewable file with every directive explained below.
#
# Phase 1 scope: this establishes the daemon foundation only. The
# application's scanFile() (src/clamav.ts) still uses standalone `clamscan`
# in this phase, not this daemon - see the service README's Phase 1 report.

# Run in the foreground: clamd must NOT fork/daemonize and detach from its
# parent process. entrypoint.sh starts clamd as a normal shell background
# job (`clamd &`) and tracks its PID directly ($!) for readiness-gating and
# signal forwarding. A self-detaching daemon would be unmanageable from a
# container lifecycle perspective - Cloud Run has no visibility into
# processes entrypoint.sh doesn't itself track.
Foreground yes

# This container runs entirely as the non-root `tesscan` user (Dockerfile's
# `USER tesscan`) - clamd is invoked as `tesscan` directly by entrypoint.sh,
# never as root, so there is nothing to drop privileges FROM. The `User`
# directive only takes effect when clamd itself is started as root; it is
# deliberately omitted here rather than set to a value clamd would ignore.

# Unix domain socket only - no TCPSocket/TCPAddr directive exists anywhere
# in this file, so clamd never opens a network listener. Both the Node
# scanner process and clamd run in the same container/filesystem namespace,
# so a Unix socket is the correct, simplest, most restrictive choice.
#
# Path is under /tmp rather than /run: /run is typically root-owned 0755 at
# container start (and may be a fresh tmpfs mount not populated from the
# image), which the non-root tesscan user cannot create a new subdirectory
# under. /tmp is world-writable (mode 1777) by standard Debian convention,
# and this exact codebase's own per-scan temp files (src/assessment.ts,
# src/clamav.ts's scannerReadiness()) already rely on that same property -
# this reuses an already-proven-safe path rather than an unverified one.
LocalSocket /tmp/tes-clamd/clamd.sock
# Owner-only socket permissions - defense in depth, even though the only
# other process in this container already runs as this same tesscan user.
LocalSocketMode 700
# If entrypoint.sh ever restarts clamd within the SAME container lifetime
# (e.g. after a failed readiness attempt) without a full container restart,
# a socket file from the previous attempt could be left behind. This lets a
# fresh clamd start replace it rather than refusing to bind. This is about
# same-container internal retries, not cross-container/cross-instance state
# (a new Cloud Run instance never resumes another instance's filesystem).
FixStaleSocket yes

# Must match the directory freshclam.conf writes to, and the directory the
# Dockerfile's existing build-time seeding step and non-root chown already
# target - unchanged from before this phase.
DatabaseDirectory /var/lib/clamav

# Operational log only - startup, shutdown, reload, and engine-level
# messages. Never document content: clamd's log format at this verbosity
# never includes scanned file contents, and no per-scan file-path logging is
# enabled here.
#
# A real regular file, NOT /dev/stdout: runtime validation of this exact
# image proved clamd's internal logger cannot open /dev/stdout in this
# container runtime -
#   ERROR: Can't initialize the internal logger
#   ERROR: Failed to open log file /dev/stdout: Too many levels of symbolic
#   links
# - clamd's logger performs a real open() (and, before the LogFileUnlock
# workaround below was tried, an flock()) against the configured path, not a
# simple write to an already-open fd; /dev/stdout is a symlink into
# /proc/self/fd/1, and resolving/locking through that symlink chain fails in
# this runtime regardless of LogFileUnlock. A regular file has none of this
# symlink/lock ambiguity. /var/log/clamav already exists and is chowned to
# the non-root tesscan runtime user at build time (see Dockerfile) - the
# exact same directory freshclam.conf's UpdateLogFile already uses
# successfully - so this reuses an already-proven-writable location rather
# than an unverified one.
LogFile /var/log/clamav/clamd.log
LogTime yes

# Deliberately NOT set in this phase - left at ClamAV's own compiled-in
# defaults because TES has not yet benchmarked production values under real
# concurrent load. The application layer (src/assessment.ts's
# SCANNER_MAX_OBJECT_BYTES, currently 25 MiB) already enforces a hard size
# cap BEFORE any file reaches ClamAV at all, so these are a secondary
# backstop, not the primary control. Flagged for later benchmarking rather
# than guessed at now:
#   MaxFileSize, MaxScanSize, MaxThreads, StreamMaxLength

# No PidFile directive: entrypoint.sh captures the shell's own $! for the
# clamd process it starts directly, which is simpler and sufficient - a
# PidFile would be redundant with that and is not read by anything in this
# service.
