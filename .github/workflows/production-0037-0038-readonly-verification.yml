name: Production 0037/0038 Read-only Verification

# READ-ONLY. Manual dispatch only. It never applies a migration, never writes a row and prints no row data (counts, booleans, catalogue facts and
# migration file names only). It exists so the production gates for migrations 0037/0038 can be checked through the SAME approved path as every other
# production check: GitHub OIDC -> Google Workload Identity Federation -> Cloud SQL Auth Proxy with IAM database authentication, in the
# `production-database` environment (whatever approval that environment requires still applies), and only from `main`.
# It does not replace or weaken the migration workflow, and it does not deploy anything.

on:
  workflow_dispatch:
    inputs:
      phase:
        description: "pre-0037 = ledger must hold 36 migrations; post-0037 = 37; post-0038 = 38"
        required: true
        default: pre-0037
        type: choice
        options:
          - pre-0037
          - post-0037
          - post-0038

permissions:
  contents: read
  id-token: write

concurrency:
  group: production-0037-0038-readonly-verification
  cancel-in-progress: false

jobs:
  verify:
    name: Verify production gates for migrations 0037/0038 (read-only)
    runs-on: ubuntu-24.04
    environment: production-database

    if: github.ref == 'refs/heads/main'

    env:
      TES_CLOUD_SQL_INSTANCE: ${{ vars.TES_CLOUD_SQL_INSTANCE }}
      TES_POSTGRES_DATABASE: ${{ vars.TES_POSTGRES_DATABASE }}
      TES_POSTGRES_IAM_USER: ${{ vars.TES_POSTGRES_IAM_USER }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          create_credentials_file: true

      - name: Backup and point-in-time recovery evidence (read-only gcloud)
        run: |
          set -euo pipefail
          CONN="${TES_CLOUD_SQL_INSTANCE}"
          PROJECT="${CONN%%:*}"
          INSTANCE="${CONN##*:}"
          if ! gcloud sql instances describe "$INSTANCE" --project "$PROJECT" --format=json > instance.json 2> describe.err; then
            echo "BLOCKER: backup/PITR configuration could not be read with the workflow identity (UNVERIFIED). Required: cloudsql.instances.get and cloudsql.backupRuns.list."
            sed -E 's/[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+/<redacted>/g' describe.err | head -5
            exit 1
          fi
          jq '{state, databaseVersion, availabilityType: .settings.availabilityType, backupEnabled: .settings.backupConfiguration.enabled, backupStartTime: .settings.backupConfiguration.startTime, pitrEnabled: .settings.backupConfiguration.pointInTimeRecoveryEnabled, transactionLogRetentionDays: .settings.backupConfiguration.transactionLogRetentionDays, retainedBackups: .settings.backupConfiguration.backupRetentionSettings.retainedBackups, deletionProtection: .settings.deletionProtectionEnabled}' instance.json
          jq -e '.settings.backupConfiguration.enabled == true and .settings.backupConfiguration.pointInTimeRecoveryEnabled == true' instance.json > /dev/null \
            || { echo "BLOCKER: automated backups and point-in-time recovery must both be enabled"; exit 1; }
          gcloud sql backups list --instance "$INSTANCE" --project "$PROJECT" --limit 5 --format=json > backups.json
          jq -r '.[] | [.id, .type, .status, .windowStartTime, .endTime] | @tsv' backups.json
          jq -e --arg cutoff "$(date -u -d '-48 hours' +%Y-%m-%dT%H:%M:%SZ)" '[.[] | select(.status == "SUCCESSFUL" and .endTime >= $cutoff)] | length > 0' backups.json > /dev/null \
            || { echo "BLOCKER: no SUCCESSFUL backup in the last 48 hours"; exit 1; }
          echo "Backup and PITR evidence: OK"

      - name: Download and verify Cloud SQL Auth Proxy
        env:
          CLOUD_SQL_PROXY_VERSION: "2.24.1"
          CLOUD_SQL_PROXY_SHA256: "fae2766aac9d614a2bdef2f2a7778f3d054f3acd5ff07a81a9e300bd471512eb"
        run: |
          curl --fail --silent --show-error --location \
            --output cloud-sql-proxy \
            "https://storage.googleapis.com/cloud-sql-connectors/cloud-sql-proxy/v${CLOUD_SQL_PROXY_VERSION}/cloud-sql-proxy.linux.amd64"
          echo "${CLOUD_SQL_PROXY_SHA256} *cloud-sql-proxy" | sha256sum --check --strict
          chmod +x cloud-sql-proxy
          ./cloud-sql-proxy --version

      - name: Start Cloud SQL Auth Proxy
        run: |
          ./cloud-sql-proxy \
            --auto-iam-authn \
            --address 127.0.0.1 \
            --port 5432 \
            "${TES_CLOUD_SQL_INSTANCE}" \
            > cloud-sql-proxy.log 2>&1 &
          echo $! > cloud-sql-proxy.pid

      - name: Wait for proxy
        run: |
          for attempt in {1..30}; do
            if (echo > /dev/tcp/127.0.0.1/5432) >/dev/null 2>&1; then
              echo "Cloud SQL Auth Proxy is accepting connections."
              exit 0
            fi
            sleep 1
          done
          echo "Cloud SQL Auth Proxy did not become ready."
          sed -E 's/[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+/<redacted>/g' cloud-sql-proxy.log | tail -5
          exit 1

      - name: Read-only gate verification (ledger, encoding, identity, privileges, conflict counts)
        env:
          PGHOST: 127.0.0.1
          PGPORT: "5432"
          PGDATABASE: ${{ env.TES_POSTGRES_DATABASE }}
          PGUSER: ${{ env.TES_POSTGRES_IAM_USER }}
          TES_VERIFY_PHASE: ${{ inputs.phase }}
        run: bash scripts/database/verify-production-0037-0038-readonly.sh

      - name: Stop Cloud SQL Auth Proxy
        if: always()
        run: |
          if [ -f cloud-sql-proxy.pid ]; then
            kill "$(cat cloud-sql-proxy.pid)" 2>/dev/null || true
          fi
