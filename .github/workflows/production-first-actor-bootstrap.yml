name: Production First Actor Bootstrap

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: production-database-bootstrap
  cancel-in-progress: false

jobs:
  bootstrap:
    name: Bootstrap first TES actor
    runs-on: ubuntu-24.04
    environment: production-database

    if: github.ref == 'refs/heads/main'

    env:
      TES_CLOUD_SQL_INSTANCE: ${{ vars.TES_CLOUD_SQL_INSTANCE }}
      TES_POSTGRES_DATABASE: ${{ vars.TES_POSTGRES_DATABASE }}
      TES_POSTGRES_IAM_USER: ${{ vars.TES_POSTGRES_IAM_USER }}
      TES_BOOTSTRAP_CLERK_USER_ID: ${{ secrets.TES_BOOTSTRAP_CLERK_USER_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          create_credentials_file: true

      - name: Download and verify Cloud SQL Auth Proxy
        env:
          CLOUD_SQL_PROXY_VERSION: "2.24.1"
          CLOUD_SQL_PROXY_SHA256: "fae2766aac9d614a2bdef2f2a7778f3d054f3acd5ff07a81a9e300bd471512eb"
        run: |
          curl --fail --silent --show-error --location \
            --output cloud-sql-proxy \
            "https://storage.googleapis.com/cloud-sql-connectors/cloud-sql-proxy/v${CLOUD_SQL_PROXY_VERSION}/cloud-sql-proxy.linux.amd64"

          echo "${CLOUD_SQL_PROXY_SHA256} *cloud-sql-proxy" | sha256sum --check --strict
          chmod +x cloud-sql-proxy
          ./cloud-sql-proxy --version

      - name: Start Cloud SQL Auth Proxy
        run: |
          ./cloud-sql-proxy \
            --auto-iam-authn \
            --address 127.0.0.1 \
            --port 5432 \
            "${TES_CLOUD_SQL_INSTANCE}" \
            > cloud-sql-proxy.log 2>&1 &

          echo $! > cloud-sql-proxy.pid

      - name: Wait for proxy
        run: |
          for attempt in {1..30}; do
            if (echo > /dev/tcp/127.0.0.1/5432) >/dev/null 2>&1; then
              echo "Cloud SQL Auth Proxy is accepting connections."
              exit 0
            fi
            sleep 1
          done

          echo "Cloud SQL Auth Proxy did not become ready."
          cat cloud-sql-proxy.log
          exit 1

      - name: Bootstrap first TES actor
        env:
          PGHOST: 127.0.0.1
          PGPORT: "5432"
          PGDATABASE: ${{ env.TES_POSTGRES_DATABASE }}
          PGUSER: ${{ env.TES_POSTGRES_IAM_USER }}
        run: bash scripts/database/bootstrap-first-actor.sh

      - name: Stop Cloud SQL Auth Proxy
        if: always()
        run: |
          if [ -f cloud-sql-proxy.pid ]; then
            kill "$(cat cloud-sql-proxy.pid)" 2>/dev/null || true
          fi
