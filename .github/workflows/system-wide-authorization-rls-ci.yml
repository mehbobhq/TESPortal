name: System-wide Authorization RLS CI

on:
  pull_request:
    paths:
      - "database/**"
      - "lib/auth/**"
      - "test/database/system-wide-authorization-rls.sql"
      - "scripts/database/verify-production-system-wide-authorization-rls.sh"
      - "docs/system-wide-authorization-rls-closure.md"
      - ".github/workflows/system-wide-authorization-rls-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tes_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d tes_ci"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGDATABASE: tes_ci
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v4
        with: { version: 11.9.0 }
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Production-shaped roles
        run: |
          psql -v ON_ERROR_STOP=1 -c 'CREATE ROLE "tes-backend@tes-production-510007.iam";'
          psql -v ON_ERROR_STOP=1 -c 'CREATE ROLE "tes-database-migrator@tes-production-510007.iam";'
      - name: Apply complete migration history
        run: bash scripts/database/migrate.sh
      - name: Ledger and RLS catalogue (complete chain 0001-0029)
        run: |
          test "$(psql -Atc 'select count(*) from tes_system.schema_migrations')" = "29"
          test "$(psql -Atc "select count(*) from pg_class c join pg_namespace n on n.oid=c.relnamespace where n.nspname='public' and c.relkind='r' and c.relrowsecurity")" = "60"
          test "$(psql -Atc "select count(*) from pg_policy p join pg_class c on c.oid=p.polrelid join pg_namespace n on n.oid=c.relnamespace where n.nspname='public'")" = "115"
      - name: Build production-shaped databases (migrator-owned; complete chain and 0001-0024 only)
        env:
          CI_MIGRATOR: "tes-database-migrator@tes-production-510007.iam"
          CI_MIGRATOR_PASSWORD: ci-migrator
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -c "ALTER ROLE \"$CI_MIGRATOR\" LOGIN PASSWORD '$CI_MIGRATOR_PASSWORD'"
          psql -v ON_ERROR_STOP=1 -c "CREATE DATABASE tes_ci_chain OWNER \"$CI_MIGRATOR\""
          psql -v ON_ERROR_STOP=1 -c "CREATE DATABASE tes_ci_0024 OWNER \"$CI_MIGRATOR\""
          first24="$(mktemp -d)"
          for f in database/migrations/[0-9][0-9][0-9][0-9]_*.sql; do
            version="$(basename "$f")"; version="${version%%_*}"
            if [[ "$version" < "0025" ]]; then cp "$f" "$first24/"; fi
          done
          test "$(ls "$first24" | wc -l)" = "24"
          PGUSER="$CI_MIGRATOR" PGPASSWORD="$CI_MIGRATOR_PASSWORD" PGDATABASE=tes_ci_0024 MIGRATIONS_DIR="$first24" bash scripts/database/migrate.sh
          PGUSER="$CI_MIGRATOR" PGPASSWORD="$CI_MIGRATOR_PASSWORD" PGDATABASE=tes_ci_chain bash scripts/database/migrate.sh
          test "$(PGUSER="$CI_MIGRATOR" PGPASSWORD="$CI_MIGRATOR_PASSWORD" PGDATABASE=tes_ci_0024 psql -Atc 'select count(*) from tes_system.schema_migrations')" = "24"
          test "$(PGUSER="$CI_MIGRATOR" PGPASSWORD="$CI_MIGRATOR_PASSWORD" PGDATABASE=tes_ci_chain psql -Atc 'select count(*) from tes_system.schema_migrations')" = "29"
      - name: Frozen 0024 closure verifier on a 0001-0024 database against PostgreSQL 17
        env:
          PGUSER: "tes-database-migrator@tes-production-510007.iam"
          PGPASSWORD: ci-migrator
          PGDATABASE: tes_ci_0024
          TES_VERIFY_PHASE: post
        run: bash scripts/database/verify-production-system-wide-authorization-rls.sh
      - name: Additive verifier 0025-0028, PRE phase on the 0001-0024 database
        env:
          PGUSER: "tes-database-migrator@tes-production-510007.iam"
          PGPASSWORD: ci-migrator
          PGDATABASE: tes_ci_0024
          TES_VERIFY_PHASE: pre
          TES_VERIFY_FROM: "0025"
          TES_VERIFY_THROUGH: "0028"
        run: bash scripts/database/verify-production-companies-foundation.sh
      - name: Additive verifier 0025-0028, POST phase on the complete-chain database
        env:
          PGUSER: "tes-database-migrator@tes-production-510007.iam"
          PGPASSWORD: ci-migrator
          PGDATABASE: tes_ci_chain
          TES_VERIFY_PHASE: post
          TES_VERIFY_FROM: "0025"
          TES_VERIFY_THROUGH: "0028"
        run: bash scripts/database/verify-production-companies-foundation.sh
      - name: Shared verifier POST 0016-0028 on the complete-chain database
        env:
          PGUSER: "tes-database-migrator@tes-production-510007.iam"
          PGPASSWORD: ci-migrator
          PGDATABASE: tes_ci_chain
          TES_VERIFY_PHASE: post
          TES_VERIFY_FROM: "0016"
          TES_VERIFY_THROUGH: "0028"
        run: bash scripts/database/verify-production-companies-foundation.sh
      - name: Adversarial cross-tenant matrix
        run: psql -v ON_ERROR_STOP=1 -f test/database/system-wide-authorization-rls.sql
      - name: RLS mutation-kill suite
        run: bash scripts/database/test-system-wide-rls-mutations.sh
      - name: Existing authorization regression
        run: bash scripts/database/verify-production-authorization.sh
      - name: TypeScript regression gate
        shell: bash
        run: |
          set +e
          pnpm exec tsc --noEmit --pretty false > /tmp/head-tsc.txt 2>&1
          git worktree add /tmp/base "${{ github.event.pull_request.base.sha }}"
          cd /tmp/base
          pnpm install --frozen-lockfile >/dev/null
          pnpm exec tsc --noEmit --pretty false > /tmp/base-tsc.txt 2>&1
          cd -
          grep 'error TS' /tmp/head-tsc.txt | sed -E 's#^([^(:]+)\([^)]*\): ##' | sort > /tmp/head-normalized.txt
          grep 'error TS' /tmp/base-tsc.txt | sed -E 's#^([^(:]+)\([^)]*\): ##' | sort > /tmp/base-normalized.txt
          diff -u /tmp/base-normalized.txt /tmp/head-normalized.txt
